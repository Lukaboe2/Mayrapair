<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>PANTHERR-X-ULTRA | Pair Code Login</title>
  <meta name="description" content="Link your WhatsApp to PANTHERR-X-ULTRA using a pair code. Fast, secure, and simple.">
  <meta name="theme-color" content="#00b8ff">
  <meta property="og:image" content="https://i.ibb.co/k6SxWhdr/84bb97a4a575.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --black:  #000000;
      --dark:   #0a0a0a;
      --dark2:  #111111;
      --white:  #ffffff;
      --blue:   #00b8ff;
      --blue2:  #0080cc;
      --yellow: #ffd700;
      --yellow2:#e6b800;
      --gray:   #777777;
      --red:    #ff4a6a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--black); color: var(--white);
      min-height: 100vh; overflow-x: hidden; scrollbar-width: none;
    }
    body::-webkit-scrollbar { display: none; }

    .grad-mixed { background:linear-gradient(135deg,var(--blue),var(--white),var(--yellow)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .grad-yellow { background:linear-gradient(135deg,var(--yellow),var(--yellow2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .grad-blue   { background:linear-gradient(135deg,var(--blue),var(--blue2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

    .blob { position:fixed; border-radius:50%; filter:blur(100px); pointer-events:none; z-index:0; }
    @keyframes blobFloat { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(20px,-20px) scale(1.05);} }
    @keyframes shake { 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-5px);} 40%,80%{transform:translateX(5px);} }
    @keyframes spin { to { transform: rotate(360deg); } }

    .accent-bar { height:3px; background:linear-gradient(90deg,var(--blue),var(--yellow),var(--blue)); }

    nav {
      background: rgba(0,0,0,0.94); border-bottom: 1px solid rgba(255,255,255,0.06);
      backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
      position:sticky; top:0; z-index:50;
    }
    .nav-inner { max-width:1000px; margin:0 auto; padding:0 20px; height:54px; display:flex; align-items:center; justify-content:space-between; }
    .nav-link { position:relative; transition:color 0.2s; }
    .nav-link::after { content:''; position:absolute; bottom:-2px; left:0; width:0; height:2px; background:var(--yellow); transition:width 0.22s; border-radius:2px; }
    .nav-link:hover { color:var(--yellow) !important; }
    .nav-link:hover::after { width:100%; }

    .card {
      background: #0d0d0d;
      border-top: 3px solid var(--blue);
      border-left: 1px solid rgba(255,255,255,0.07);
      border-right: 1px solid rgba(255,255,255,0.07);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    }

    input {
      width:100%; background:rgba(255,255,255,0.04);
      border:1.5px solid rgba(255,255,255,0.1); color:var(--white);
      border-radius:11px; font-size:0.9rem; font-family:inherit;
      padding:13px 14px 13px 42px;
      transition:border-color 0.2s, box-shadow 0.2s;
    }
    input::placeholder { color:#333; }
    input:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,184,255,0.1); }

    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      padding:13px 24px; border-radius:11px;
      font-weight:800; font-size:0.9rem; font-family:inherit;
      cursor:pointer; border:none; text-decoration:none; width:100%;
      transition:transform 0.18s, box-shadow 0.18s;
    }
    .btn:active { transform:scale(0.97)!important; }
    .btn-blue { background:linear-gradient(135deg,var(--blue),var(--blue2)); color:#000; }
    .btn-blue:hover { transform:translateY(-2px); box-shadow:0 12px 30px rgba(0,184,255,0.35); }
    .btn-blue:disabled { opacity:0.5; cursor:not-allowed; transform:none!important; box-shadow:none!important; }

    .spinner { width:16px; height:16px; border:2px solid rgba(0,0,0,0.3); border-top-color:#000; border-radius:50%; animation:spin 0.7s linear infinite; }

    .code-box {
      background: #0a0a0a; border:1.5px solid var(--yellow);
      border-radius:14px; padding:28px; text-align:center;
      box-shadow: 0 0 30px rgba(255,215,0,0.1);
    }

    .copy-btn {
      background:rgba(0,184,255,0.1); border:1.5px solid rgba(0,184,255,0.3);
      border-radius:10px; color:var(--blue); padding:9px 20px;
      font-size:0.8rem; font-weight:700; font-family:inherit;
      cursor:pointer; display:flex; align-items:center; gap:6px;
      transition:background 0.18s, transform 0.18s;
    }
    .copy-btn:hover { background:rgba(0,184,255,0.2); transform:translateY(-2px); }
    .copy-btn.copied { background:rgba(0,255,136,0.08); border-color:rgba(0,255,136,0.3); color:#00ff88; }

    .new-btn {
      background:transparent; border:1.5px solid rgba(255,255,255,0.1);
      border-radius:10px; color:var(--gray); padding:9px 20px;
      font-size:0.8rem; font-weight:700; font-family:inherit;
      cursor:pointer; display:flex; align-items:center; gap:6px;
      transition:background 0.18s, color 0.18s, transform 0.18s;
    }
    .new-btn:hover { background:rgba(255,255,255,0.05); color:var(--white); transform:translateY(-2px); }

    .social-icon {
      width:32px; height:32px; border-radius:7px;
      background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07);
      display:flex; align-items:center; justify-content:center;
      color:var(--gray); font-size:0.82rem; text-decoration:none;
      transition:background 0.2s, color 0.2s, transform 0.2s;
    }
    .social-icon:hover { background:rgba(255,215,0,0.1); color:var(--yellow); transform:translateY(-2px); }

    [data-anim] { will-change:transform,opacity; transition:opacity 0.6s cubic-bezier(0.4,0,0.2,1),transform 0.6s cubic-bezier(0.4,0,0.2,1); }
    [data-anim="fade-up"] { opacity:0; transform:translateY(28px); }
    [data-anim="zoom-in"] { opacity:0; transform:scale(0.9); }
    [data-anim].in-view { opacity:1; transform:translateY(0) scale(1); }
    [data-delay="1"]{transition-delay:0.1s;} [data-delay="2"]{transition-delay:0.2s;}
  </style>
</head>
<body>
  <div class="accent-bar"></div>
  <div class="blob" style="width:400px;height:400px;background:rgba(0,100,200,0.12);top:-80px;left:-80px;animation:blobFloat 14s ease-in-out infinite;"></div>
  <div class="blob" style="width:280px;height:280px;background:rgba(255,215,0,0.05);bottom:10%;right:-60px;animation:blobFloat 18s ease-in-out 5s infinite;"></div>

  <nav>
    <div class="nav-inner">
      <a href="/" style="display:flex;align-items:center;gap:9px;text-decoration:none;">
        <img src="https://i.ibb.co/k6SxWhdr/84bb97a4a575.jpg" alt="logo" style="width:30px;height:30px;border-radius:50%;border:2px solid var(--yellow);object-fit:cover;">
        <span style="font-weight:900;font-size:0.88rem;" class="grad-mixed">PANTHERR-X-ULTRA</span>
      </a>
      <div style="display:flex;align-items:center;gap:22px;">
        <a href="https://github.com/GuruhTech/PANTHERR-X-ULTRA-PAIR" target="_blank" class="nav-link" style="color:var(--gray);font-size:0.8rem;font-weight:500;text-decoration:none;"><i class="fab fa-github"></i> Source</a>
        <a href="/pair" class="nav-link" style="color:var(--blue);font-size:0.8rem;font-weight:700;text-decoration:none;"><i class="fas fa-link"></i> Pair Code</a>
        <a href="/qr" class="nav-link" style="color:var(--gray);font-size:0.8rem;font-weight:500;text-decoration:none;"><i class="fas fa-qrcode"></i> QR Code</a>
      </div>
      <a href="/qr" style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,215,0,0.08);border:1.5px solid rgba(255,215,0,0.25);color:var(--yellow);padding:7px 15px;border-radius:9px;font-size:0.78rem;font-weight:700;text-decoration:none;transition:background 0.18s;" onmouseover="this.style.background='rgba(255,215,0,0.16)'" onmouseout="this.style.background='rgba(255,215,0,0.08)'">
        <i class="fas fa-qrcode"></i> Use QR Instead
      </a>
    </div>
  </nav>

  <main style="position:relative;z-index:10;min-height:calc(100vh - 57px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;">
    <div style="width:100%;max-width:420px;">

      <!-- Header -->
      <div style="text-align:center;margin-bottom:28px;" data-anim="fade-up">
        <div style="display:flex;justify-content:center;margin-bottom:18px;">
          <div style="position:relative;">
            <div style="width:82px;height:82px;border-radius:50%;border:2.5px solid var(--yellow);padding:3px;box-shadow:0 0 0 5px rgba(255,215,0,0.07),0 0 40px rgba(255,215,0,0.12);">
              <img src="https://i.ibb.co/k6SxWhdr/84bb97a4a575.jpg" alt="logo" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">
            </div>
            <span style="position:absolute;bottom:0;right:0;background:var(--blue);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:2px solid #000;">
              <i class="fas fa-link" style="color:#000;font-size:0.68rem;"></i>
            </span>
          </div>
        </div>
        <h1 style="font-size:1.7rem;font-weight:900;margin-bottom:6px;" class="grad-blue">Pair Code Login</h1>
        <p style="color:var(--gray);font-size:0.84rem;">Enter your WhatsApp number — no + sign needed</p>
      </div>

      <!-- Card -->
      <div class="card" style="padding:28px;" data-anim="zoom-in" data-delay="1">

        <!-- FORM -->
        <div id="formSection">
          <div style="margin-bottom:20px;">
            <label style="display:block;font-size:0.7rem;font-weight:800;color:var(--gray);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Phone Number</label>
            <div style="position:relative;">
              <i class="fas fa-phone" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#333;font-size:0.8rem;pointer-events:none;"></i>
              <input id="phoneNumber" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="e.g., 2547xxxxxxxx">
            </div>
            <p id="phoneError" style="display:none;color:var(--red);font-size:0.76rem;margin-top:6px;align-items:center;gap:5px;">
              <i class="fas fa-exclamation-circle"></i> <span id="phoneErrorText"></span>
            </p>
          </div>

          <button id="submitBtn" class="btn btn-blue" style="margin-bottom:4px;">
            <span id="btnContent" style="display:flex;align-items:center;gap:8px;">
              <i class="fas fa-bolt"></i> GET PAIR CODE
            </span>
            <span id="btnLoading" style="display:none;align-items:center;gap:8px;">
              <span class="spinner"></span> Fetching code...
            </span>
          </button>

          <p id="generalError" style="display:none;color:var(--red);font-size:0.76rem;text-align:center;margin-top:10px;"></p>

          <div style="margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;gap:8px;">
            <span style="color:#333;font-size:0.78rem;">Prefer QR?</span>
            <a href="/qr" style="color:var(--yellow);font-size:0.78rem;font-weight:700;text-decoration:none;display:flex;align-items:center;gap:4px;transition:opacity 0.18s;" onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='1'">
              <i class="fas fa-qrcode"></i> Scan QR Code
            </a>
          </div>
        </div>

        <!-- RESULT -->
        <div id="resultSection" style="display:none;">
          <div style="text-align:center;margin-bottom:22px;">
            <div style="width:46px;height:46px;border-radius:12px;background:rgba(0,255,136,0.1);border:1.5px solid rgba(0,255,136,0.25);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;">
              <i class="fas fa-check" style="color:#00ff88;font-size:1.1rem;"></i>
            </div>
            <p style="color:var(--white);font-weight:800;font-size:0.95rem;margin-bottom:4px;">Your Pair Code</p>
            <p style="color:var(--gray);font-size:0.78rem;">Enter this in WhatsApp → Linked Devices → Link a Device</p>
          </div>

          <div class="code-box" style="margin-bottom:20px;">
            <p id="pairCode" style="font-size:2.5rem;font-weight:900;letter-spacing:9px;color:var(--yellow);text-shadow:0 0 20px rgba(255,215,0,0.3);"></p>
          </div>

          <div style="display:flex;gap:10px;justify-content:center;margin-bottom:20px;">
            <button id="copyBtn" class="copy-btn">
              <i class="fas fa-copy" style="font-size:0.72rem;"></i>
              <span id="copyText">Copy Code</span>
            </button>
            <button id="newCodeBtn" class="new-btn">
              <i class="fas fa-redo" style="font-size:0.72rem;"></i> New Code
            </button>
          </div>

          <div style="padding-top:16px;border-top:1px solid rgba(255,255,255,0.05);text-align:center;">
            <a href="/" style="color:var(--gray);font-size:0.78rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:color 0.18s;" onmouseover="this.style.color='var(--white)'" onmouseout="this.style.color='var(--gray)'">
              <i class="fas fa-arrow-left" style="font-size:0.72rem;"></i> Back to Home
            </a>
          </div>
        </div>
      </div>

      <!-- Mini stats -->
      <div style="margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;" data-anim="fade-up" data-delay="2">
        <div style="background:#0d0d0d;border:1px solid rgba(0,184,255,0.12);border-top:2px solid var(--blue);border-radius:11px;padding:12px;text-align:center;">
          <i class="fas fa-shield-alt" style="color:var(--blue);font-size:0.9rem;display:block;margin-bottom:6px;"></i>
          <p style="color:var(--gray);font-size:0.7rem;">Encrypted</p>
        </div>
        <div style="background:#0d0d0d;border:1px solid rgba(255,215,0,0.12);border-top:2px solid var(--yellow);border-radius:11px;padding:12px;text-align:center;">
          <i class="fas fa-bolt" style="color:var(--yellow);font-size:0.9rem;display:block;margin-bottom:6px;"></i>
          <p style="color:var(--gray);font-size:0.7rem;">Instant</p>
        </div>
        <div style="background:#0d0d0d;border:1px solid rgba(255,255,255,0.06);border-top:2px solid var(--white);border-radius:11px;padding:12px;text-align:center;">
          <i class="fas fa-mobile-alt" style="color:var(--white);font-size:0.9rem;display:block;margin-bottom:6px;"></i>
          <p style="color:var(--gray);font-size:0.7rem;">No Phone</p>
        </div>
      </div>
    </div>
  </main>

  <footer style="padding:20px;background:#050505;border-top:1px solid rgba(255,255,255,0.04);">
    <div style="max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
      <a href="/" style="display:flex;align-items:center;gap:7px;text-decoration:none;">
        <img src="https://i.ibb.co/k6SxWhdr/84bb97a4a575.jpg" alt="logo" style="width:22px;height:22px;border-radius:50%;border:1px solid var(--yellow);object-fit:cover;">
        <span style="font-size:0.76rem;font-weight:900;" class="grad-mixed">PANTHERR-X-ULTRA</span>
      </a>
      <p style="color:#222;font-size:0.72rem;">&copy; <span id="yr"></span> GuruTech Lab</p>
      <div style="display:flex;gap:7px;">
        <a href="https://github.com/GuruhTech/PANTHERR-X-ULTRA-PAIR" target="_blank" class="social-icon"><i class="fab fa-github"></i></a>
        <a href="https://youtube.com/@GuruTech" target="_blank" class="social-icon"><i class="fab fa-youtube"></i></a>
        <a href="https://whatsapp.com/channel/0029VbCl2UX3rZZilMSvxN1e" target="_blank" class="social-icon"><i class="fab fa-whatsapp"></i></a>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();
    const obs = new IntersectionObserver(entries => entries.forEach(e => e.isIntersecting ? e.target.classList.add('in-view') : e.target.classList.remove('in-view')), { threshold: 0.1 });
    document.querySelectorAll('[data-anim]').forEach(el => obs.observe(el));

    (function setFavicon(src) {
      const c = document.createElement('canvas'); c.width = c.height = 64;
      const ctx = c.getContext('2d'), img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => { ctx.beginPath(); ctx.arc(32,32,32,0,Math.PI*2); ctx.closePath(); ctx.clip(); ctx.drawImage(img,0,0,64,64); const l = document.createElement('link'); l.type='image/png'; l.rel='shortcut icon'; l.href = c.toDataURL(); document.head.appendChild(l); };
      img.src = src;
    })('https://i.ibb.co/k6SxWhdr/84bb97a4a575.jpg');

    const phoneInput = document.getElementById('phoneNumber');
    const submitBtn  = document.getElementById('submitBtn');
    const btnContent = document.getElementById('btnContent');
    const btnLoading = document.getElementById('btnLoading');
    const phoneError = document.getElementById('phoneError');
    const phoneErrorText = document.getElementById('phoneErrorText');
    const generalError = document.getElementById('generalError');
    const formSection = document.getElementById('formSection');
    const resultSection = document.getElementById('resultSection');
    const pairCodeEl = document.getElementById('pairCode');
    const copyBtn = document.getElementById('copyBtn');
    const copyText = document.getElementById('copyText');
    const newCodeBtn = document.getElementById('newCodeBtn');

    function showError(msg) {
      phoneErrorText.textContent = msg;
      phoneError.style.display = 'flex';
      phoneInput.style.borderColor = 'rgba(255,74,106,0.6)';
      phoneInput.style.animation = 'shake 0.4s ease';
      setTimeout(() => phoneInput.style.animation = '', 400);
    }
    function clearError() { phoneError.style.display = 'none'; phoneInput.style.borderColor = ''; }
    function setLoading(on) {
      submitBtn.disabled = on;
      btnContent.style.display = on ? 'none' : 'flex';
      btnLoading.style.display = on ? 'flex' : 'none';
    }
    phoneInput.addEventListener('input', clearError);

    submitBtn.addEventListener('click', async () => {
      const raw = phoneInput.value.trim().replace(/[^0-9]/g, '');
      if (!raw || raw.length < 7) { showError('Enter a valid phone number'); return; }
      clearError(); generalError.style.display = 'none'; setLoading(true);
      try {
        const res = await fetch(`/code?number=${raw}&type=long`);
        const data = await res.json();
        if (!res.ok || !data.code) throw new Error(data.code || 'Failed');
        pairCodeEl.textContent = data.code;
        formSection.style.display = 'none';
        resultSection.style.display = 'block';
      } catch (err) {
        generalError.textContent = err.message || 'Could not fetch pair code. Try again.';
        generalError.style.display = 'block';
      } finally { setLoading(false); }
    });

    phoneInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitBtn.click(); });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(pairCodeEl.textContent).then(() => {
        copyBtn.classList.add('copied'); copyText.textContent = 'Copied!';
        setTimeout(() => { copyBtn.classList.remove('copied'); copyText.textContent = 'Copy Code'; }, 2000);
      });
    });

    newCodeBtn.addEventListener('click', () => {
      formSection.style.display = 'block'; resultSection.style.display = 'none';
      generalError.style.display = 'none'; phoneInput.value = '';
    });
  </script>
</body>
</html>
