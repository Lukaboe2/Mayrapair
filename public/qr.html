<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ULTRA GURU | QR Code Login</title>
  <meta name="description" content="Link your account to ULTRA GURU by scanning a QR code. Fast, secure, and simple.">
  <meta name="theme-color" content="#f59e0b">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --brand-primary: #f59e0b; /* Amber 500 */
      --brand-glow: rgba(245, 158, 11, 0.4);
      --bg-dark: #030303;
      --card-bg: #0d0d0d;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-dark);
      color: #fafafa;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .gradient-text {
      background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .blob {
      position: fixed; border-radius: 50%;
      filter: blur(90px); pointer-events: none; z-index: 0; will-change: transform;
    }
    @keyframes blobFloat {
      0%,100% { transform: translate(0,0) scale(1); }
      50%      { transform: translate(20px,-20px) scale(1.05); }
    }

    .nav-glass {
      background: rgba(3, 3, 3, 0.85);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    
    .nav-link:hover { color: var(--brand-primary); }

    .sidebar-link:hover { background: rgba(245, 158, 11, 0.1); color: var(--brand-primary); transform: translateX(4px); }

    #sidebar { transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); background: #0a0a0a; }

    .btn-primary { 
      background: var(--brand-primary); 
      color: #000; 
      font-weight: 700;
      border-radius: 12px;
      transition: all 0.3s ease;
    }
    .btn-primary:hover { 
      transform: translateY(-3px); 
      box-shadow: 0 10px 25px var(--brand-glow); 
      filter: brightness(1.1);
    }
    
    .btn-ghost { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 12px; }

    .social-icon:hover { background: rgba(245, 158, 11, 0.2); color: var(--brand-primary); }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, transparent, var(--brand-primary), transparent);
    }

    [data-anim].in-view { opacity: 1; transform: translateY(0) scale(1); }
    [data-anim] { opacity: 0; transform: translateY(20px); transition: all 0.6s ease-out; }
  </style>
</head>
<body>
  <div class="blob w-96 h-96 bg-amber-600/10 top-[-80px] left-[-80px]" style="animation:blobFloat 14s ease-in-out infinite;"></div>

  <nav class="nav-glass sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 no-underline">
        <div class="w-8 h-8 rounded-lg bg-amber-500 flex items-center justify-center">
          <i class="fas fa-bolt text-black text-sm"></i>
        </div>
        <span class="text-lg font-bold tracking-tight">ULTRA <span class="text-amber-500">GURU</span></span>
      </a>
      <div class="hidden md:flex items-center gap-7">
        <a href="#" class="nav-link text-gray-400 text-sm font-medium transition-colors">Source Code</a>
        <a href="/pair" class="nav-link text-gray-400 text-sm font-medium transition-colors">Pair Code</a>
        <a href="/qr" class="text-amber-500 text-sm font-medium">QR Code</a>
      </div>
      <div class="flex items-center gap-3">
        <button id="menuBtn" class="md:hidden text-gray-400"><i class="fas fa-bars text-xl"></i></button>
      </div>
    </div>
  </nav>

  <main class="relative z-10">
    <section class="min-h-[calc(100vh-64px)] flex flex-col items-center justify-center px-5 py-12">
      <div class="w-full max-w-md">

        <div class="text-center mb-8" data-anim="fade-up">
          <h1 class="text-3xl font-extrabold mb-2">QR Node</h1>
          <p class="text-gray-500 text-sm uppercase tracking-widest">Handshake Protocol</p>
        </div>

        <div class="card p-8 shadow-2xl" data-anim="zoom-in">
          <div class="mb-6">
            <label class="block text-[10px] font-black uppercase tracking-widest text-amber-500 mb-3">Session Type</label>
            <div class="flex rounded-xl overflow-hidden border border-white/10 bg-black/40 p-1">
              <button type="button" id="typeShort" onclick="selectType('short')"
                class="flex-1 py-2 text-xs font-bold rounded-lg transition-all"
                style="background:var(--brand-primary); color:#000;">
                SHORT
              </button>
              <button type="button" id="typeLong" onclick="selectType('long')"
                class="flex-1 py-2 text-xs font-bold rounded-lg transition-all"
                style="background:transparent; color:#6b7280;">
                LONG
              </button>
            </div>
          </div>

          <button id="generateBtn" onclick="startQR()" class="btn-primary w-full py-4 flex items-center justify-center gap-3 group">
            <i class="fas fa-qrcode"></i>
            <span>GENERATE QR CODE</span>
          </button>

          <div class="mt-8 pt-6 border-t border-white/5">
            <div class="bg-amber-500/5 border border-amber-500/10 rounded-xl p-4">
              <p class="text-amber-500 text-[10px] font-black uppercase mb-3 tracking-widest">Instructions</p>
              <ul class="text-gray-500 text-xs space-y-2">
                <li class="flex gap-2"><span>1.</span> <span>Open WhatsApp on your phone</span></li>
                <li class="flex gap-2"><span>2.</span> <span>Tap Menu or Settings → Linked Devices</span></li>
                <li class="flex gap-2"><span>3.</span> <span>Point your camera at the generated QR</span></li>
              </ul>
            </div>
          </div>
        </div>

        <div class="mt-8 grid grid-cols-3 gap-3">
          <div class="bg-white/[0.02] border border-white/5 rounded-xl p-3 text-center">
            <i class="fas fa-shield-alt text-amber-500 text-xs mb-1 block"></i>
            <p class="text-[10px] text-gray-600 uppercase">Secure</p>
          </div>
          <div class="bg-white/[0.02] border border-white/5 rounded-xl p-3 text-center">
            <i class="fas fa-bolt text-amber-500 text-xs mb-1 block"></i>
            <p class="text-[10px] text-gray-600 uppercase">Instant</p>
          </div>
          <div class="bg-white/[0.02] border border-white/5 rounded-xl p-3 text-center">
            <i class="fas fa-fingerprint text-amber-500 text-xs mb-1 block"></i>
            <p class="text-[10px] text-gray-600 uppercase">Verified</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="py-8 border-t border-white/5 text-center bg-[#050505]">
    <p class="text-[10px] text-gray-600 uppercase tracking-widest">
      © 2026 ULTRA GURU • Built with precision by GuruTech
    </p>
  </footer>

  <script>
    /* Note: Built for the Ultra Guru Project by GuruTech. */
    let selectedType = 'short';

    function selectType(type) {
      selectedType = type;
      const sBtn = document.getElementById('typeShort');
      const lBtn = document.getElementById('typeLong');
      if (type === 'short') {
        sBtn.style.background = 'var(--brand-primary)';
        sBtn.style.color = '#000';
        lBtn.style.background = 'transparent';
        lBtn.style.color = '#6b7280';
      } else {
        lBtn.style.background = 'var(--brand-primary)';
        lBtn.style.color = '#000';
        sBtn.style.background = 'transparent';
        sBtn.style.color = '#6b7280';
      }
    }

    function startQR() {
      window.location.href = `/qr/session?type=${selectedType}`;
    }

    // Simple reveal animation
    document.querySelectorAll('[data-anim]').forEach(el => {
      el.classList.add('in-view');
    });
  </script>
</body>
</html>
